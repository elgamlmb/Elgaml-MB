name: Enable site language switch
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  inject:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add language engine
        run: python3 -c "from pathlib import Path;p=Path('index.html');s=p.read_text(encoding='utf-8');tag='<script src=\"lang.js\"></script>';s=s if tag in s else s.replace('</body>',tag+'</body>');p.write_text(s,encoding='utf-8')"
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || (git commit -m 'Enable complete Arabic and English language switching' && git push)
