name: Fix bilingual language system

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-language:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace language script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          start=s.rfind('<script>')
          end=s.rfind('</script>')
          if start < 0 or end < start: raise SystemExit('script block not found')
          js=r'''<script>
const html=document.documentElement;
const langBtn=document.getElementById('langBtn');
const themeBtn=document.getElementById('themeBtn');
let lang=localStorage.getItem('siteLang')||'ar';
const T={
'المشاكل':'Problems','القيمة':'Value','النتائج':'Results','دراسات الحالة':'Case Studies','الخدمات':'Services','من أنا':'About','تواصل':'Contact','احجز مكالمة':'Book a Call','EN':'AR','Performance Media Buyer · E-commerce Growth':'Performance Media Buyer · E-commerce Growth','بتصرف على الإعلانات...':'Spending on ads...','بس مش شايف النمو؟':'but not seeing growth?','مشكلتك مش بالضرورة في الـAds. أحيانًا السبب بيكون في الـCreative، الـOffer، الـLanding Page، الـTracking أو الـConversion. دوري إني أحدد نقطة التعطيل وأبني Testing System واضح بدل القرارات العشوائية.':'The problem is not always the ads. It can be the Creative, Offer, Landing Page, Tracking, or Conversion. My role is to identify the bottleneck and build a clear testing system instead of making random decisions.','احجز مكالمة مجانية 15 دقيقة':'Book a free 15-minute call','شوف دراسات الحالة':'View Case Studies','سنوات خبرة':'Years of experience','مشروع وحملة':'Projects & campaigns','منصات إعلانية':'Ad platforms','هل ده بيحصل عندك؟':'Does this sound familiar?','قبل ما تزود الـBudget... لازم تعرف المشكلة فين':'Before increasing the budget, know where the problem is','لو واحدة أو أكثر من النقاط دي مألوفة ليك، فالمشكلة محتاجة Diagnosis قبل أي Scaling.':'If one or more of these feel familiar, the business needs a diagnosis before scaling.','بتصرف ومش فاهم الفلوس بتروح فين':'You spend but cannot see where the money goes','بتشوف Spend وClicks، لكن مش عندك صورة واضحة عن السبب الحقيقي وراء النتيجة.':'You see spend and clicks, but not a clear picture of what is really driving the result.','Traffic موجود... والمبيعات مش كفاية':'Traffic is there... but sales are not enough','ممكن المشكلة تكون بعد الـClick: Offer، Product Page، Trust، Checkout أو Conversion.':'The bottleneck may be after the click: Offer, Product Page, Trust, Checkout, or Conversion.','كل Creative تجربة جديدة':'Every Creative becomes a new experiment','مفيش نظام واضح لاختبار Hooks وAngles وFormats ومعرفة إيه اللي يستحق التوسع.':'There is no clear system for testing Hooks, Angles, and Formats and knowing what deserves scale.','ROAS كويس لكن الربح مش واضح':'ROAS looks good but profit is unclear','ROAS لوحده مش كفاية. لازم تشوف CAC وAOV وCVR وجودة العميل والاقتصاديات.':'ROAS alone is not enough. You need CAC, AOV, CVR, customer quality, and unit economics.','بتزود الميزانية والنتيجة بتسوء':'You increase budget and performance gets worse','Scaling من غير Winners واضحين ونظام Refresh ممكن يحرق بيانات وBudget.':'Scaling without clear winners and a refresh system can waste data and budget.','مش عارف المشكلة في الـAds ولا الـStore':'You cannot tell if the problem is the Ads or the Store','بدل ما نرمي اللوم على المنصة، بنفصل الـFunnel ونحدد أين يحدث التسريب.':'Instead of blaming the platform, we break down the funnel and identify where the leakage happens.','القيمة اللي بتاخدها':'The value you get','بعد الشغل... المفروض الصورة تبقى أوضح':'After the work, the picture should be clearer','مش هتشتري مجرد Campaign Management. الهدف إن يبقى عندك طريقة تفكير ونظام قرارات تقدر تبني عليه.':'You are not buying campaign management alone. The goal is a decision system you can build on.','وضوح في المشكلة':'Clarity on the real problem','تعرف هل أكبر Opportunity في الـCreative، الـOffer، الـFunnel، الـTracking أو الـConversion.':'Know whether the biggest opportunity is in Creative, Offer, Funnel, Tracking, or Conversion.','قرارات مبنية على بيانات':'Data-driven decisions','كل Test له فرضية، وكل قرار له سبب بدل تغييرات عشوائية.':'Every test has a hypothesis, and every decision has a reason instead of random changes.','Creative System':'Creative System','Hooks وAngles وFormats وVariations يتم اختبارها ثم تطوير ما يثبت نفسه.':'Hooks, Angles, Formats, and Variations are tested, then the winners are developed.','Funnel كامل':'Full-funnel thinking','من أول Ad وLanding Page لحد Cart وCheckout وRetargeting.':'From the first Ad and Landing Page through Cart, Checkout, and Retargeting.','فهم أفضل للأرقام':'Better understanding of the numbers','CAC وAOV وCVR وجودة العملاء بجانب ROAS، وليس Metric واحدة فقط.':'CAC, AOV, CVR, and customer quality alongside ROAS—not one metric alone.','جاهزية للتوسع':'Ready to scale','توسيع ما يثبت نفسه مع Refresh مستمر بدل Scaling عشوائي.':'Scale what proves itself with continuous creative refresh instead of random scaling.','مش وعد برقم ثابت. النتيجة تعتمد على المنتج، العرض، البيانات والاقتصاديات.':'There is no fixed-result promise. Outcomes depend on the product, offer, data, and unit economics.','نتائج فعلية من الـPortfolio':'Real results from the portfolio','أرقام موثقة من الحالات المتاحة، بدون إضافة ROAS أو Revenue Projections غير مؤكدة.':'Verified numbers from available cases, with no invented ROAS or revenue projections.','إجمالي مبيعات لمتجر أثاث في السعودية.':'Total sales for a Saudi furniture store.','إجمالي مبيعات لعلامة تجارية في الأجهزة المنزلية بالسعودية.':'Total sales for a Saudi home-appliances brand.','إجمالي مبيعات لمتجر عود وعطور في السعودية.':'Total sales for a Saudi oud and fragrance store.','عملية شراء لمتجر عبايات سعودي خلال 10 أيام.':'Purchases for a Saudi abaya store in 10 days.','عملية شراء لمتجر E-commerce في أقل من أسبوعين.':'Purchases for an e-commerce store in under two weeks.','من النتيجة إلى طريقة التفكير':'From results to the thinking behind them','كل منتج له دوافع شراء مختلفة، لذلك بنغير الـCreative Angles والرسائل والـRetargeting حسب الـIntent.':'Every product has different buying motivations, so Creative Angles, messaging, and Retargeting change by intent.','نظام الكريتف الأسبوعي':'Weekly creative system','Control + Hooks/Angles أساسية.':'Control + core Hooks/Angles.','تغيير Opening أو Creator أو Format مع الحفاظ على الـWinning Angle.':'Change the Opening, Creator, or Format while keeping the Winning Angle.','Angles جديدة وSegments إضافية.':'New Angles and additional Segments.','توسيع الفائزين وإدخال دفعة Creatives جديدة.':'Scale winners and introduce a new batch of Creatives.','آراء العملاء':'Client feedback','مش مجرد تشغيل حملات':'More than campaign execution','القيمة في التفكير وراء القرار، مش في تشغيل الحملة فقط.':'The value is in the thinking behind each decision, not just campaign execution.','مش مجرد تشغيل حملات، التركيز كان على البيزنس كله.':'It was not just campaign execution; the focus was on the whole business.','كل قرار له سبب، والأرقام بقت أوضح وأسهل في اتخاذ القرار.':'Every decision had a reason, and the numbers became clearer and easier to act on.','من الاختبار إلى التوسع، كان فيه منطق واضح في كل خطوة.':'From testing to scaling, there was clear logic behind every step.','الخدمات':'Services','مش خدمة واحدة — منظومة Acquisition':'Not one service — a complete Acquisition system','Audience Analysis، Market Study، Budget Allocation وخطة اختبار.':'Audience Analysis, Market Study, Budget Allocation, and a testing plan.','Hooks، Angles، Offers، UGC، Formats، Testing وRefresh.':'Hooks, Angles, Offers, UGC, Formats, Testing, and Refresh.','Meta وGoogle وTikTok وSnapchat مع Performance Analysis مستمر.':'Meta, Google, TikTok, and Snapchat with continuous Performance Analysis.','Customer Journey، Product View، Cart Recovery وPost-purchase.':'Customer Journey, Product View, Cart Recovery, and Post-purchase.','Landing Page Optimization، Conversion Rate Optimization، Tracking & Analytics.':'Landing Page Optimization, Conversion Rate Optimization, Tracking & Analytics.','تحديد Winners، إعادة توزيع الميزانية والتوسع تدريجيًا.':'Identify Winners, reallocate budget, and scale progressively.','القطاعات':'Industries','خبرة مركزة في E-commerce':'Focused E-commerce experience','أثاث وHome Products':'Furniture and Home Products','ملابس وعبايات':'Fashion and Abayas','عطور وعود':'Fragrances and Oud','Beauty & Personal Care':'Beauty & Personal Care','أجهزة منزلية':'Home Appliances','منتجات السيارات':'Automotive Products','إلكترونيات وإكسسوارات':'Electronics and Accessories','من الفهم إلى التوسع':'From understanding to scale','فهم المنتج، العرض، العميل والاقتصاديات الأساسية.':'Understand the product, offer, customer, and core unit economics.','فصل المشكلة بين Creative وOffer وFunnel وTracking وConversion.':'Separate the problem across Creative, Offer, Funnel, Tracking, and Conversion.','بناء Testing Plan وAudience وCreative Matrix.':'Build the Testing Plan, Audience strategy, and Creative Matrix.','اختبار Hooks وAngles وOffers وFormats بشكل منظم.':'Systematically test Hooks, Angles, Offers, and Formats.','قراءة CAC وCVR وAOV وجودة العميل والربحية بجانب ROAS.':'Read CAC, CVR, AOV, customer quality, and profitability alongside ROAS.','توسيع ما يثبت نفسه وإدخال Creatives جديدة باستمرار.':'Scale what proves itself and continuously introduce new Creatives.','Performance Media Buyer يركز على الـBusiness مش الـAds بس.':'A Performance Media Buyer focused on the Business, not just the Ads.','أنا Elgaml MB، متخصص في Performance Marketing وPaid Acquisition للـE-commerce، مع خبرة أكثر من 3 سنوات والعمل على أكثر من 20 مشروع وحملة.':'I am Elgaml MB, a Performance Marketing and Paid Acquisition specialist for E-commerce, with 3+ years of experience across 20+ projects and campaigns.','الهدف مش مجرد ROAS أعلى؛ الهدف بناء Acquisition System يحوّل البيانات لقرارات واضحة.':'The goal is not simply a higher ROAS; it is to build an Acquisition System that turns data into clear decisions.','من أنا':'About','الخطوة التالية':'Next step','خلينا نعرف إيه اللي موقف النمو عندك':'Let’s find what is blocking your growth','احجز مكالمة مجانية لمدة 15 دقيقة. نتكلم عن المنتج، الأرقام، الـFunnel وأكبر مشكلة شايفها حاليًا.':'Book a free 15-minute call. We will discuss your product, numbers, funnel, and the biggest issue you see today.','ابدأ على WhatsApp':'Start on WhatsApp','لا توجد أرقام أو توقعات مالية إضافية بدون بيانات موثقة.':'No additional numbers or financial projections are shown without verified data.','Performance Media Buyer · E-commerce Growth':'Performance Media Buyer · E-commerce Growth','© 2026 Elgaml MB':'© 2026 Elgaml MB','Furniture':'Furniture','Home Appliances':'Home Appliances','Fragrances & Oud':'Fragrances & Oud','Abayas':'Abayas','E-commerce':'E-commerce','Fashion & Abayas':'Fashion & Abayas','Cosmetics':'Cosmetics','Automotive':'Automotive','Electronics':'Electronics','FURNITURE':'FURNITURE','ABAYAS':'ABAYAS','FRAGRANCES & OUD':'FRAGRANCES & OUD','HOME APPLIANCES':'HOME APPLIANCES','FASHION':'FASHION','COSMETICS':'COSMETICS','AUTOMOTIVE':'AUTOMOTIVE','ELECTRONICS':'ELECTRONICS','إجمالي المبيعات':'Total Sales','Saudi Arabia · Total Sales':'Saudi Arabia · Total Sales','Saudi Arabia · Purchases':'Saudi Arabia · Purchases','Purchases · Under 2 Weeks':'Purchases · Under 2 Weeks','Room Transformation · Quality · Social Proof · Bundle':'Room Transformation · Quality · Social Proof · Bundle','Upsell للمقاسات والباندلز + Cross-sell لإكسسوارات الغرفة':'Upsell for sizes and bundles + Cross-sell for room accessories','Occasion · Fabric · Comfort · UGC · New Arrival':'Occasion · Fabric · Comfort · UGC · New Arrival','Trust + Product Details + إزالة الاعتراضات':'Trust + Product Details + objection handling','Story-led · Notes · Gift · Best Seller · Social Proof':'Story-led · Notes · Gift · Best Seller · Social Proof','Bundles + Gift Sets + Repeat Purchase':'Bundles + Gift Sets + Repeat Purchase','Feature → Benefit · Demo · Comparison · Trust':'Feature → Benefit · Demo · Comparison · Trust','Education → Proof → Specs → Objections → Checkout':'Education → Proof → Specs → Objections → Checkout','Complete Look → Fit → Quality':'Complete Look → Fit → Quality','اختبار نفس المنتج بأكثر من سبب للشراء، ثم إنتاج Variations من الـWinning Angle.':'Test the same product with multiple reasons to buy, then produce Variations from the Winning Angle.','Viewed Product → Proof · Cart → Reason to Complete':'Viewed Product → Proof · Cart → Reason to Complete','Upsell + Cross-sell + Post-purchase Recommendations':'Upsell + Cross-sell + Post-purchase Recommendations','Problem → Solution → Proof':'Problem → Solution → Proof','Demo وUGC وBenefits ورسائل مختلفة حسب المشكلة والـIntent.':'Demo, UGC, Benefits, and different messages based on the problem and intent.','Hook + Problem + Proof + CTA':'Hook + Problem + Proof + CTA','Routine Cross-sell + Replenishment + Bundles':'Routine Cross-sell + Replenishment + Bundles','Compatibility → Demo → Trust':'Compatibility → Demo → Trust','التركيز على التوافق، المشكلة التي يحلها المنتج، وطريقة الاستخدام.':'Focus on compatibility, the problem the product solves, and how to use it.','Compatibility + Proof + Shipping/Returns':'Compatibility + Proof + Shipping/Returns','Winning Angle على Products/Models أخرى':'Winning Angle across other Products/Models','Feature → Benefit → Use Case':'Feature → Benefit → Use Case','اختبار المنتج نفسه بأكثر من سبب للشراء، ثم توسيع الرسالة التي تثبت نفسها.':'Test the same product with multiple reasons to buy, then expand the message that proves itself.','Comparison · Demo · UGC · Price/Value · Bundle':'Comparison · Demo · UGC · Price/Value · Bundle','معالجة اعتراض حقيقي: قيمة، مواصفات، شحن أو إرجاع':'Handle a real objection: value, specs, shipping, or returns','Baseline':'Baseline','Iteration':'Iteration','Expansion':'Expansion','Scale + Refresh':'Scale + Refresh','Creative':'Creative','Growth':'Growth','Retargeting':'Retargeting','Funnel':'Funnel','Testing':'Testing','LTV':'LTV','Basket':'Basket','Cart':'Cart','Platforms':'Platforms','Focus':'Focus','3+ Years · 20+ Projects · Meta · Google · TikTok · Snapchat':'3+ Years · 20+ Projects · Meta · Google · TikTok · Snapchat'};
function translateNode(root,on){
 const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
 const nodes=[]; while(walker.nextNode()) nodes.push(walker.currentNode);
 nodes.forEach(n=>{const v=n.nodeValue.trim(); if(!v)return; const x=on?v:(T[v]||v); if(x!==v)n.nodeValue=n.nodeValue.replace(v,x)});
}
function applyLanguage(){
 const en=lang==='en'; html.lang=en?'en':'ar'; html.dir=en?'ltr':'rtl'; langBtn.textContent=en?'AR':'EN';
 document.title=en?'Elgaml MB — Performance Media Buyer':'Elgaml MB — Performance Media Buyer';
 if(!en){location.reload();return}
 translateNode(document.body,true);
}
const originalHTML=document.body.innerHTML;
function render(){
 if(lang==='ar'){if(document.body.innerHTML!==originalHTML) location.reload(); return;}
 translateNode(document.body,false);
 document.querySelectorAll('[alt]').forEach(el=>{if(el.getAttribute('alt')==='Elgaml MB — Performance Media Buyer')el.setAttribute('alt','Elgaml MB — Performance Media Buyer')});
 const wa='https://wa.me/201508611225?text='+encodeURIComponent('Hello, I would like to learn more about your performance marketing service');
 document.querySelectorAll('a[href*="wa.me"]').forEach(a=>{if(a.textContent.includes('WhatsApp')||a.textContent.includes('Start'))a.href=wa});
}
langBtn.onclick=()=>{lang=lang==='ar'?'en':'ar';localStorage.setItem('siteLang',lang);if(lang==='ar')location.reload();else render();};
themeBtn.onclick=()=>{html.classList.toggle('light');themeBtn.textContent=html.classList.contains('light')?'☀':'☾';localStorage.setItem('siteTheme',html.classList.contains('light')?'light':'dark')};
if(localStorage.getItem('siteTheme')==='light'){html.classList.add('light');themeBtn.textContent='☀'}
if(lang==='en')render();
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)e.target.classList.add('visible')}),{threshold:.12});
document.querySelectorAll('.reveal').forEach(e=>io.observe(e));
</script>'''
          s=s[:start]+js+s[end+9:]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit language fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix complete Arabic and English language switching'
          git push
